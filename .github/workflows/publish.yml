name: Publish extension

on:
  workflow_dispatch:
  push:
    tags:
      # Version numbers carry no prefix: 0.4.5, 0.5.0, ...
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @vscode/vsce publish --oidc
